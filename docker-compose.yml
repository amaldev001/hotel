version: '3.9'

services:
  # ──────────────────────────────────────────────
  # MongoDB
  # ──────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: food_ordering_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MongoDB root password required}
      MONGO_INITDB_DATABASE: food_ordering
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ──────────────────────────────────────────────
  # Application Server
  # ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
    container_name: food_ordering_app
    restart: unless-stopped
    ports:
      - '5000:5000'
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '5000'
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongo:27017/food_ordering?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Frontend origin required}
      APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
      CURRENCY: ${CURRENCY:-USD}
      TAX_PERCENT: ${TAX_PERCENT:-0}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-stripe}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Stripe secret key required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Stripe webhook secret required}
      UPLOAD_DIR: uploads
      TRUST_PROXY: 'true'
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:5000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local
  uploads_data:
    driver: local
